name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Typecheck reads the sources under bundler resolution and would stay green
      # while the shipped declarations resolve to nothing.
      - name: Check declarations
        run: pnpm check:dts

      - name: Typecheck
        run: pnpm typecheck

      # The only guard against a `sideEffects` field tree-shaking the entry's
      # stylesheet away. Running it solely in the Pages workflow catches that
      # after merge, when it blocks a deploy instead of a review.
      - name: Build playground
        run: pnpm build:playground

      - name: Test (unit)
        run: pnpm test

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test (browser)
        run: pnpm test:browser

      - name: Audit
        run: pnpm exec fallow audit --base origin/main
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
